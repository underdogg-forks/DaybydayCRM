name: Docker Build

on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - default
      - develop
      - main
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'docker-compose*.yml'
      - '.dockerignore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker-compose build

      - name: Verify images exist
        run: |
          docker image ls | grep -E 'daybydaycrm|nginx' || echo "No images found"
