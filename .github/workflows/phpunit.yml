name: phpunit

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Which tests to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke
          - api
          - crud
          - custom
          - flaky
          - junie_repaired
      custom_group_name:
        description: 'Custom PHPUnit group name (only used if "custom" selected above)'
        required: false
        type: string
      output:
        description: 'Output format'
        required: true
        default: 'testdox'
        type: choice
        options:
          - pao
          - testdox
      fail_fast:
        description: 'Fail fast (stop on first error)?'
        required: true
        default: 'false'
        type: choice
        options:
          - "false"
          - "true"

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ inputs.test_group }} (output:${{ inputs.output }}, fail_fast:${{ inputs.fail_fast }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL ready!"
              break
            fi
            sleep 2
          done

      - name: Prepare .env
        run: |
          cp .env.ci .env.testing
          cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-scripts --no-interaction --optimize-autoloader --prefer-dist

      - name: Regenerate autoloader
        run: composer dump-autoload --no-scripts

      - name: Generate app key
        run: php artisan key:generate

      - name: Clear configurations
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Create test database
        run: |
          mysql -h 127.0.0.1 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS daybyday_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run migrations
        run: php artisan migrate:fresh --seed

      - name: Set test run options
        id: opts
        run: |
          # Output style flag
          if [ "${{ github.event.inputs.output }}" = "pao" ]; then
            OUT_OPT=""
          else
            OUT_OPT="--testdox"
          fi

          # Fail fast settings
          if [ "${{ github.event.inputs.fail_fast }}" = "true" ]; then
            FAILFAST="--stop-on-failure"
          else
            FAILFAST=""
          fi

          # Set GROUP to input value, or default to "full"
          GROUP="${{ github.event.inputs.test_group }}"
          if [ -z "$GROUP" ]; then
            GROUP="full"
          fi

          echo "OUT_OPT=${OUT_OPT}" >> $GITHUB_ENV
          echo "FAILFAST=${FAILFAST}" >> $GITHUB_ENV
          echo "GROUP=${GROUP}" >> $GITHUB_ENV
          echo "CUSTOM_GROUP=${{ github.event.inputs.custom_group_name }}" >> $GITHUB_ENV

      - name: Run tests
        shell: bash
        run: |
          LOG_FILE="phpunit-output.log"

          if [ "$GROUP" = "full" ]; then
            vendor/bin/phpunit --exclude-group flaky $OUT_OPT $FAILFAST > "$LOG_FILE" 2>&1
          elif [ "$GROUP" = "custom" ]; then
            vendor/bin/phpunit --exclude-group flaky --group="$CUSTOM_GROUP" $OUT_OPT $FAILFAST > "$LOG_FILE" 2>&1
          else
            vendor/bin/phpunit --exclude-group flaky --group="$GROUP" $OUT_OPT $FAILFAST > "$LOG_FILE" 2>&1
          fi
          PHPUNIT_EXIT=$?

          echo "=== Failures / Errors (passing tests stripped) ==="
          php .github/scripts/parse-phpunit.php < "$LOG_FILE" || true

          exit $PHPUNIT_EXIT

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-log-php${{ matrix.php }}
          path: phpunit-output.log
          retention-days: 7

